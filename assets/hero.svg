<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
  <title id="t">Edahi Avila</title>
  <desc id="d">Construyendo soluciones reales. Flujo animado: reto, aprender, prototipar, solución.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="end" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0f4f"/>
      <stop offset="1" stop-color="#5b1240"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#2a1f4a"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "Fira Code", Consolas, "Courier New", monospace; }
    .sans { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .blink { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
  </style>

  <rect width="900" height="300" rx="20" fill="#0b0716"/>
  <rect width="900" height="300" rx="20" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="19.5" fill="none" stroke="#2e1f57"/>

  <text x="48" y="106" class="sans" font-size="56" font-weight="800" fill="url(#g)">Edahi Avila</text>
  <text x="50" y="142" class="sans" font-size="20" fill="#c4b5fd">Construyendo soluciones reales</text>
  <text x="50" y="174" class="mono" font-size="14" fill="#8b7fb8">// autodidacta por convicción · Ecatepec, Edomex<tspan class="blink" fill="#f472b6"> _</tspan></text>

  <line x1="48" y1="238" x2="852" y2="238" stroke="#6d28d9" stroke-width="2" class="flow"/>
  <circle r="5" fill="#f0abfc">
    <animateMotion dur="5s" repeatCount="indefinite" path="M48,238 L852,238"/>
  </circle>

  <g class="mono">
    <rect x="48" y="210" width="174" height="56" rx="12" fill="#150d2b" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="66" y="233" font-size="15" font-weight="700" fill="#f5e1ff">01 Reto</text>
    <text x="66" y="251" font-size="11" fill="#a78bfa">parece imposible</text>

    <rect x="258" y="210" width="174" height="56" rx="12" fill="#150d2b" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="276" y="233" font-size="15" font-weight="700" fill="#f5e1ff">02 Aprender</text>
    <text x="276" y="251" font-size="11" fill="#a78bfa">lo que haga falta</text>

    <rect x="468" y="210" width="174" height="56" rx="12" fill="#150d2b" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="486" y="233" font-size="15" font-weight="700" fill="#f5e1ff">03 Prototipar</text>
    <text x="486" y="251" font-size="11" fill="#a78bfa">rápido y en vivo</text>

    <rect x="678" y="210" width="174" height="56" rx="12" fill="url(#end)" stroke="#db2777" stroke-width="1.5"/>
    <text x="696" y="233" font-size="15" font-weight="700" fill="#fff">04 Solución</text>
    <text x="696" y="251" font-size="11" fill="#f9a8d4">real y usable</text>
  </g>
</svg>
