<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
  <title id="t">Edahi Avila</title>
  <desc id="d">Construyendo soluciones reales. Noche nevada con cristales de hielo y flujo animado: reto, fallo con retorno al inicio, aprender, solución.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a1f"/>
      <stop offset="0.6" stop-color="#150f3d"/>
      <stop offset="1" stop-color="#2a1250"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="0.55" stop-color="#c9d6ff"/>
      <stop offset="1" stop-color="#b79cff"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4f8ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#cdd9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8fa0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="end" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2a8f"/>
      <stop offset="1" stop-color="#7a3bb8"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <g id="flake" fill="none" stroke="#cfe3ff" stroke-width="1.6" stroke-linecap="round">
      <path d="M0,-14 V14 M-12,-7 L12,7 M-12,7 L12,-7"/>
      <path d="M-3,-11 L0,-8 L3,-11 M-3,11 L0,8 L3,11 M-10,-4 L-7,-6 L-9,-9 M10,4 L7,6 L9,9 M-10,4 L-7,6 L-9,9 M10,-4 L7,-6 L9,-9"/>
    </g>
  </defs>
  <style>
    .mono  { font-family: ui-monospace, "Fira Code", Consolas, "Courier New", monospace; }
    .serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .jp    { font-family: "Yu Gothic", "Meiryo", "Hiragino Sans", "Noto Sans CJK JP", sans-serif; }

    .star { animation: tw 3.2s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

    .snow { animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes fall { from { transform: translate(0, -20px); } to { transform: translate(-26px, 370px); } }

    .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .mist1 { animation: drift 16s ease-in-out infinite; }
    .mist2 { animation: drift 22s ease-in-out infinite reverse; }
    @keyframes drift { 0%, 100% { transform: translateX(-30px); } 50% { transform: translateX(30px); } }

    .flow  { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .back  { stroke-dasharray: 5 7; animation: back 0.9s linear infinite; }
    @keyframes back { to { stroke-dashoffset: 24; } }

    .cnt { opacity: 0; animation: cnt 10s linear infinite; }
    @keyframes cnt { 0% { opacity: 1; } 19% { opacity: 1; } 20%, 100% { opacity: 0; } }
    .blink { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
  </style>

  <!-- noche -->
  <rect width="900" height="340" rx="20" fill="url(#sky)"/>
  <circle cx="800" cy="78" r="96" fill="url(#moon)"/>
  <circle cx="800" cy="78" r="30" fill="#f4f8ff" opacity="0.92"/>

  <g fill="#e8eeff">
    <circle class="star" cx="70" cy="40" r="1.4"/>
    <circle class="star" cx="150" cy="86" r="1" style="animation-delay:.7s"/>
    <circle class="star" cx="260" cy="30" r="1.6" style="animation-delay:1.3s"/>
    <circle class="star" cx="380" cy="64" r="1" style="animation-delay:2.1s"/>
    <circle class="star" cx="470" cy="28" r="1.3" style="animation-delay:.4s"/>
    <circle class="star" cx="560" cy="80" r="1.1" style="animation-delay:1.7s"/>
    <circle class="star" cx="640" cy="36" r="1.5" style="animation-delay:2.6s"/>
    <circle class="star" cx="700" cy="110" r="1" style="animation-delay:1s"/>
    <circle class="star" cx="880" cy="140" r="1.2" style="animation-delay:.2s"/>
    <circle class="star" cx="30" cy="150" r="1" style="animation-delay:1.9s"/>
  </g>

  <!-- cristales de hielo -->
  <g transform="translate(610 120) scale(1.4)"><g class="spin" opacity="0.55"><use href="#flake"/></g></g>
  <g class="spin" opacity="0.5"><use href="#flake" x="850" y="215"/></g>
  <g transform="translate(430 70) scale(0.8)"><g class="spin" opacity="0.35"><use href="#flake"/></g></g>

  <!-- miasma de la bruja -->
  <g filter="url(#blur)">
    <path class="mist1" d="M-60,330 C80,250 180,320 320,290 S560,250 700,300 S900,270 980,320 V360 H-60 Z" fill="#3b0f66" opacity="0.75"/>
    <path class="mist2" d="M-60,345 C120,300 260,350 420,320 S700,300 960,340 V370 H-60 Z" fill="#12061f" opacity="0.9"/>
  </g>

  <!-- nieve -->
  <g fill="#ffffff" opacity="0.85">
    <circle class="snow" cx="60"  cy="0" r="2"   style="animation-duration:9s"/>
    <circle class="snow" cx="130" cy="0" r="1.4" style="animation-duration:12s; animation-delay:-3s"/>
    <circle class="snow" cx="215" cy="0" r="2.4" style="animation-duration:10s; animation-delay:-6s"/>
    <circle class="snow" cx="300" cy="0" r="1.6" style="animation-duration:13s; animation-delay:-1s"/>
    <circle class="snow" cx="395" cy="0" r="2.2" style="animation-duration:9.5s; animation-delay:-4s"/>
    <circle class="snow" cx="480" cy="0" r="1.5" style="animation-duration:11.5s; animation-delay:-8s"/>
    <circle class="snow" cx="565" cy="0" r="2"   style="animation-duration:10.5s; animation-delay:-2s"/>
    <circle class="snow" cx="650" cy="0" r="1.3" style="animation-duration:12.5s; animation-delay:-7s"/>
    <circle class="snow" cx="735" cy="0" r="2.3" style="animation-duration:9s; animation-delay:-5s"/>
    <circle class="snow" cx="820" cy="0" r="1.7" style="animation-duration:11s; animation-delay:-9s"/>
    <circle class="snow" cx="880" cy="0" r="2"   style="animation-duration:13s; animation-delay:-10s"/>
    <circle class="snow" cx="20"  cy="0" r="1.5" style="animation-duration:10s; animation-delay:-11s"/>
  </g>

  <!-- marco -->
  <rect x="0.5" y="0.5" width="899" height="339" rx="19.5" fill="none" stroke="#3b3f8f"/>

  <!-- texto -->
  <text x="48" y="48" class="jp" font-size="13" fill="#9fb0ff" letter-spacing="2">Re:ゼロから · 始める開発</text>
  <text x="48" y="118" class="serif" font-size="60" font-weight="700" fill="url(#title)">Edahi Avila</text>
  <text x="50" y="152" class="serif" font-size="20" font-style="italic" fill="#c9d3ff">Construyendo soluciones reales</text>
  <text x="50" y="180" class="mono" font-size="13" fill="#8c9bdc">// si algo falla, vuelvo al checkpoint e intento de nuevo<tspan class="blink" fill="#b79cff"> _</tspan></text>

  <!-- retorno por muerte -->
  <path d="M345,236 C345,190 135,190 135,236" fill="none" stroke="#ff5c7a" stroke-width="2" class="back"/>
  <path d="M135,236 l-5,-9 m5,9 l8,-7" stroke="#ff5c7a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <text x="240" y="226" class="mono" font-size="11" fill="#ff9db0" text-anchor="middle">↺ retorno por muerte</text>

  <g class="mono" font-size="12" font-weight="700" fill="#cfe3ff">
    <text class="cnt" x="470" y="214" style="animation-delay:0s">intento #1  ✗</text>
    <text class="cnt" x="470" y="214" style="animation-delay:2s">intento #2  ✗</text>
    <text class="cnt" x="470" y="214" style="animation-delay:4s">intento #3  ✗</text>
    <text class="cnt" x="470" y="214" style="animation-delay:6s">intento #4  ✗</text>
    <text class="cnt" x="470" y="214" style="animation-delay:8s" fill="#7ef0b5">intento #5  ✓</text>
  </g>

  <!-- pipeline -->
  <line x1="48" y1="266" x2="852" y2="266" stroke="#7c8cff" stroke-width="2" class="flow"/>
  <circle r="5" fill="#9ee7ff">
    <animateMotion dur="5s" repeatCount="indefinite" path="M48,266 L852,266"/>
  </circle>

  <g class="mono">
    <rect x="48" y="236" width="174" height="60" rx="12" fill="#0f1237" fill-opacity="0.92" stroke="#7c8cff" stroke-width="1.5"/>
    <text x="66" y="260" font-size="15" font-weight="700" fill="#f4f8ff">01 Reto</text>
    <text x="66" y="279" font-size="11" fill="#9fb0ff">parece imposible</text>

    <rect x="258" y="236" width="174" height="60" rx="12" fill="#2a0f24" fill-opacity="0.94" stroke="#ff5c7a" stroke-width="1.5"/>
    <text x="276" y="260" font-size="15" font-weight="700" fill="#ffe3e9">02 Fallo</text>
    <text x="276" y="279" font-size="11" fill="#ff9db0">y vuelvo atrás</text>

    <rect x="468" y="236" width="174" height="60" rx="12" fill="#0f1237" fill-opacity="0.92" stroke="#7c8cff" stroke-width="1.5"/>
    <text x="486" y="260" font-size="15" font-weight="700" fill="#f4f8ff">03 Aprender</text>
    <text x="486" y="279" font-size="11" fill="#9fb0ff">lo que haga falta</text>

    <rect x="678" y="236" width="174" height="60" rx="12" fill="url(#end)" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="696" y="260" font-size="15" font-weight="700" fill="#ffffff">04 Solución</text>
    <text x="696" y="279" font-size="11" fill="#e0d4ff">real y usable</text>
  </g>
</svg>
