<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
  <title id="t">Interludio: la mansión bajo la nieve</title>
  <desc id="d">Escena nocturna animada: una mansión en una colina nevada con ventanas que parpadean, una luna grande, un reloj fantasma que gira hacia atrás y manos de sombra que se mecen.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05081c"/>
      <stop offset="0.65" stop-color="#1a1244"/>
      <stop offset="1" stop-color="#3a1a62"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4f8ff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#cdd9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8fa0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "Fira Code", Consolas, "Courier New", monospace; }
    .star { animation: tw 3.4s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .snow { animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes fall { from { transform: translate(0, -20px); } to { transform: translate(-30px, 370px); } }
    .win { animation: flick 4s steps(1) infinite; }
    @keyframes flick { 0%, 100% { opacity: 1; } 18% { opacity: 0.35; } 22% { opacity: 1; } 61% { opacity: 0.6; } 64% { opacity: 1; } }
    .hand  { transform-origin: 60px 340px; animation: sway 6s ease-in-out infinite; }
    .handr { transform-origin: 850px 340px; animation: sway 7.5s ease-in-out infinite reverse; }
    @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
    .hh { transform-origin: 300px 118px; animation: rev 20s linear infinite reverse; }
    .mh { transform-origin: 300px 118px; animation: rev 5s linear infinite reverse; }
    @keyframes rev { to { transform: rotate(360deg); } }
    .ring { transform-origin: 300px 118px; animation: rev 40s linear infinite; }
  </style>

  <rect width="900" height="340" rx="20" fill="url(#sky)"/>

  <!-- estrellas -->
  <g fill="#e8eeff">
    <circle class="star" cx="60" cy="36" r="1.4"/><circle class="star" cx="170" cy="70" r="1" style="animation-delay:.8s"/>
    <circle class="star" cx="420" cy="30" r="1.5" style="animation-delay:1.4s"/><circle class="star" cx="520" cy="84" r="1" style="animation-delay:2s"/>
    <circle class="star" cx="640" cy="40" r="1.3" style="animation-delay:.3s"/><circle class="star" cx="730" cy="96" r="1.1" style="animation-delay:1.1s"/>
    <circle class="star" cx="870" cy="52" r="1.4" style="animation-delay:2.4s"/><circle class="star" cx="360" cy="150" r="1" style="animation-delay:1.7s"/>
  </g>

  <!-- luna -->
  <circle cx="690" cy="86" r="120" fill="url(#halo)"/>
  <circle cx="690" cy="86" r="38" fill="#f4f8ff"/>
  <circle cx="678" cy="78" r="6" fill="#dfe6ff" opacity="0.7"/>
  <circle cx="702" cy="98" r="4" fill="#dfe6ff" opacity="0.6"/>

  <!-- reloj fantasma: retorno por muerte -->
  <g opacity="0.35" fill="none" stroke="#cfe3ff" stroke-linecap="round">
    <circle cx="300" cy="118" r="74" stroke-width="1.5"/>
    <circle class="ring" cx="300" cy="118" r="86" stroke-width="1" stroke-dasharray="3 9"/>
    <g stroke-width="2">
      <path d="M300,52 v10 M300,174 v10 M234,118 h10 M356,118 h10"/>
      <path d="M333,61 l-4,7 M367,85 l-7,4 M367,151 l-7,-4 M333,175 l-4,-7 M267,175 l4,-7 M233,151 l7,-4 M233,85 l7,4 M267,61 l4,7" stroke-width="1.4"/>
    </g>
    <path class="hh" d="M300,118 V84" stroke-width="3.5"/>
    <path class="mh" d="M300,118 V66" stroke-width="2.4" stroke="#ff9db0"/>
    <circle cx="300" cy="118" r="4" fill="#cfe3ff"/>
  </g>

  <!-- montañas -->
  <path d="M0,250 L90,190 L170,235 L270,170 L380,240 L470,200 L560,250 L650,205 L760,255 L840,215 L900,245 V340 H0Z" fill="#1c1654"/>
  <path d="M0,278 L120,235 L230,272 L350,230 L470,276 L590,240 L720,280 L830,248 L900,270 V340 H0Z" fill="#120d3a"/>

  <!-- mansión -->
  <g fill="#070518" stroke="#2c2470" stroke-width="1.5">
    <rect x="580" y="205" width="170" height="100"/>
    <polygon points="570,205 665,152 760,205"/>
    <rect x="545" y="172" width="38" height="133"/>
    <polygon points="539,172 564,124 589,172"/>
    <rect x="744" y="184" width="34" height="121"/>
    <polygon points="738,184 761,142 784,184"/>
    <rect x="648" y="168" width="14" height="40"/>
    <polygon points="644,168 655,152 666,168"/>
  </g>
  <g fill="#ffd27a">
    <rect class="win" x="598" y="228" width="11" height="17" style="animation-delay:-.6s"/>
    <rect class="win" x="628" y="228" width="11" height="17" style="animation-delay:-2.1s"/>
    <rect class="win" x="660" y="240" width="14" height="22" style="animation-delay:-1.3s"/>
    <rect class="win" x="694" y="228" width="11" height="17" style="animation-delay:-3s"/>
    <rect class="win" x="722" y="228" width="11" height="17" style="animation-delay:-.2s"/>
    <rect class="win" x="559" y="196" width="9" height="14" style="animation-delay:-1.8s"/>
    <rect class="win" x="757" y="208" width="9" height="14" style="animation-delay:-2.6s"/>
    <rect class="win" x="651" y="176" width="8" height="12" style="animation-delay:-.9s"/>
  </g>

  <!-- pinos -->
  <g fill="#06041a">
    <polygon points="470,300 490,236 510,300"/><polygon points="494,300 510,246 526,300"/>
    <polygon points="808,300 826,244 844,300"/><polygon points="40,320 58,262 76,320"/>
    <polygon points="210,300 232,236 254,300"/>
  </g>

  <!-- colina nevada -->
  <path d="M0,300 C140,270 300,305 460,288 S720,270 900,300 V340 H0Z" fill="#0a0825"/>
  <path d="M0,300 C140,270 300,305 460,288 S720,270 900,300" fill="none" stroke="#bcd0ff" stroke-opacity="0.55" stroke-width="2"/>

  <!-- manos de sombra -->
  <g class="hand">
    <path d="M60,345 C30,290 115,262 82,200 S52,160 92,128" fill="none" stroke="#6d28d9" stroke-width="22" stroke-linecap="round" opacity="0.45" filter="url(#glow)"/>
    <path d="M60,345 C30,290 115,262 82,200 S52,160 92,128" fill="none" stroke="#04020c" stroke-width="13" stroke-linecap="round"/>
    <g stroke="#04020c" stroke-width="5" stroke-linecap="round">
      <path d="M92,128 L70,106"/><path d="M92,128 L80,96"/><path d="M92,128 L94,92"/><path d="M92,128 L108,98"/><path d="M92,128 L118,112"/>
    </g>
  </g>
  <g class="handr">
    <path d="M850,345 C880,300 800,270 830,215 S860,178 826,150" fill="none" stroke="#6d28d9" stroke-width="18" stroke-linecap="round" opacity="0.4" filter="url(#glow)"/>
    <path d="M850,345 C880,300 800,270 830,215 S860,178 826,150" fill="none" stroke="#04020c" stroke-width="11" stroke-linecap="round"/>
    <g stroke="#04020c" stroke-width="4.5" stroke-linecap="round">
      <path d="M826,150 L846,128"/><path d="M826,150 L836,118"/><path d="M826,150 L824,114"/><path d="M826,150 L810,120"/><path d="M826,150 L802,134"/>
    </g>
  </g>

  <!-- nieve -->
  <g fill="#ffffff" opacity="0.85">
    <circle class="snow" cx="40"  cy="0" r="2"   style="animation-duration:9s"/>
    <circle class="snow" cx="120" cy="0" r="1.5" style="animation-duration:12s; animation-delay:-4s"/>
    <circle class="snow" cx="210" cy="0" r="2.3" style="animation-duration:10s; animation-delay:-7s"/>
    <circle class="snow" cx="330" cy="0" r="1.6" style="animation-duration:13s; animation-delay:-2s"/>
    <circle class="snow" cx="420" cy="0" r="2.1" style="animation-duration:9.5s; animation-delay:-5s"/>
    <circle class="snow" cx="520" cy="0" r="1.4" style="animation-duration:11.5s; animation-delay:-8s"/>
    <circle class="snow" cx="610" cy="0" r="2"   style="animation-duration:10.5s; animation-delay:-3s"/>
    <circle class="snow" cx="760" cy="0" r="1.8" style="animation-duration:12.5s; animation-delay:-9s"/>
    <circle class="snow" cx="850" cy="0" r="2.2" style="animation-duration:9s; animation-delay:-6s"/>
    <circle class="snow" cx="900" cy="0" r="1.5" style="animation-duration:11s; animation-delay:-10s"/>
  </g>

  <text x="450" y="326" class="mono" font-size="12" letter-spacing="2" fill="#aab6f0" text-anchor="middle" opacity="0.9">cada reintento me acerca a la solución</text>
  <rect x="0.5" y="0.5" width="899" height="339" rx="19.5" fill="none" stroke="#3b3f8f"/>
</svg>
